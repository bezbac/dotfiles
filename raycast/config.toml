# Raycast configuration
# =====================
# Run ./compile.sh to convert this into config.json (the settings JSON) and
# config.rayconfig (the Raycast import file).
#
# To apply: open Raycast, run "Import Settings & Data", pick config.rayconfig.
#
# The structure mirrors Raycast's export format (top-level "settings").
# See README.md for setup, import and update instructions.

[settings]
# Schema version of the settings block (from Raycast exports).
schemaVersion = 1

[settings.general]

# Launch Raycast automatically when you log in.
openAtLogin = true

# Show the Raycast icon in the macOS menu bar.
showInMenuBar = false

# Appearance: "system", "light", or "dark".
appearance = "system"

# Theme applied in dark/light mode.
themeDarkId = "bundled-raycast-dark"
themeLightId = "bundled-raycast-light"

# Launcher window mode: "compact" or "default".
windowMode = "compact"

# Which screen the window appears on: "active-screen", "primary", "cursor".
windowPresentationMode = "active-screen"

# What happens to the window when it loses focus:
# "move-to-active-space" or "stay-on-active-space".
windowActivationBehavior = "move-to-active-space"

# Seconds before the launcher returns to root after the last keypress (0 = never).
popToRootTimeout = 0

# Behavior of the Escape key: "pop-back-or-close", "close", "ignore".
escapeKeyBehavior = "pop-back-or-close"

# Escape also closes the window.
escapeKeyClosesWindow = true

# Hide the Raycast menu bar icon (additional to showInMenuBar).
tidyMenuBar = true

# Allow Spotlight's gesture to trigger Raycast.
useSpotlightGesture = false

# UI zoom factor (1.0 = 100%).
uiZoom = 1

# Preset for built-in hotkeys: "improved", "classic", "custom".
builtinHotkeysPreset = "improved"

# Navigation key bindings: "emacs" or "vim".
navigationBindings = "emacs"

# Page navigation keys: "square-brackets" or "tab".
pageNavigationKeys = "square-brackets"

# Root search sensitivity: "low", "medium", "high", "very-high".
rootSearchSensitivity = "low"

# Show favorites in compact window mode.
showFavoritesInCompactMode = true

# Global hotkey that opens Raycast.
# Mirrors the export format:
#   - locality: "Global"
#   - modifier "Meta" = Cmd
#   - code 49 = Space (layout-independent keycode)
[settings.general.globalHotkey]
locality = "Global"

[settings.general.globalHotkey.kind]
type = "SingleStep"

[settings.general.globalHotkey.kind.shortcut.key]
type = "LayoutIndependent"
code = 49

[[settings.general.globalHotkey.kind.shortcut.modifiers]]
modifier = "Meta"


# Internal extensions are merged into the exported settings by id.
# Entries not listed here retain their exported state and metadata;
# see deep_merge in compile.sh.
[[settings.internalExtensions]]
id = "e:r:ai"
enabled = false

[[settings.internalExtensions]]
id = "e:r:browser"
enabled = false

[[settings.internalExtensions]]
id = "e:r:contacts"
enabled = false

[[settings.internalExtensions]]
id = "e:r:developer"
enabled = false

[[settings.internalExtensions]]
id = "e:r:mcp"
enabled = false

[[settings.internalExtensions]]
id = "e:r:notes"
enabled = false

[[settings.internalExtensions]]
id = "e:r:organizations"
enabled = false

[[settings.internalExtensions]]
id = "e:r:quicklinks"
enabled = false

[[settings.internalExtensions]]
id = "e:r:raycast-focus"
enabled = false

[[settings.internalExtensions]]
id = "e:r:screen-awareness"
enabled = false

[[settings.internalExtensions]]
id = "e:r:script-commands"
enabled = false

[[settings.internalExtensions]]
id = "e:r:snippets"
enabled = false

[[settings.internalExtensions]]
id = "e:r:window-management"
enabled = false


# Vim Leader Key is restored as part of the generated Raycast import. Its
# localStorage is generated from leader-key.json by compile.sh.
[[settings.nodeExtensions]]
# Raycast's internal Store ID for akshay_k/vim-leader-key, derived from an
# export; Raycast does not document it as a stable public API.
id = "e:n:7eaf27c8-43af-40f1-a8d7-a7c3e76c8df0"
enabled = true

[[settings.nodeExtensions.preferenceTypes]]
name = "enableTimeout"
type = "checkbox"

[[settings.nodeExtensions.preferenceTypes]]
name = "timeoutSeconds"
type = "textfield"

[[settings.nodeExtensions.preferenceTypes]]
name = "openUrlsInActiveBrowser"
type = "checkbox"


# Command overrides are also merged into the exported settings by id.
[[settings.commands]]
id = "c:n:7eaf27c8-43af-40f1-a8d7-a7c3e76c8df0::-::import-config"
extensionId = "e:n:7eaf27c8-43af-40f1-a8d7-a7c3e76c8df0"
enabled = true
assumedViewKind = "Form"

[[settings.commands]]
id = "c:n:7eaf27c8-43af-40f1-a8d7-a7c3e76c8df0::-::leader-key"
extensionId = "e:n:7eaf27c8-43af-40f1-a8d7-a7c3e76c8df0"
enabled = true
assumedViewKind = "List"

[[settings.commands]]
id = "c:r:clipboard-history::-::history"

[settings.commands.macosHotkey]
locality = "Global"

[settings.commands.macosHotkey.kind]
type = "SingleStep"

[settings.commands.macosHotkey.kind.shortcut.key]
type = "LayoutIndependent"
# macOS layout-independent keycode for V.
code = 9

[[settings.commands.macosHotkey.kind.shortcut.modifiers]]
modifier = "Shift"

[[settings.commands.macosHotkey.kind.shortcut.modifiers]]
modifier = "Meta"
