command_timeout = 100
scan_timeout = 10

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$rust\
$nodejs\
$time\
$shell\
$line_break\
$character
"""

# Disable the right-aligned prompt.
right_format = ""

[character]
success_symbol = "[→](bold green)"
error_symbol = "[→](bold red)"
vicmd_symbol = "[→](bold green)"

[time]
disabled = false
